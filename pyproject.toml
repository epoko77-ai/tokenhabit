[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenhabit"
version = "1.3.0"
description = "Scan your Claude Code logs and find the habits silently burning your tokens. No LLM calls, no dependencies, runs offline."
readme = "README.en.md"   # PyPI page stays English; GitHub front page is Korean
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Seunghyun Lee", email = "epoko@nate.com" }]
keywords = ["claude", "claude-code", "tokens", "cost", "llm", "ccusage", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/epoko77-ai/tokenhabit"
Repository = "https://github.com/epoko77-ai/tokenhabit"
Issues = "https://github.com/epoko77-ai/tokenhabit/issues"

[project.scripts]
tokenhabit = "tokenhabit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tokenhabit"]

# The sdist ships the project, not the workshop. Without an explicit allowlist
# hatchling packs the whole tree — 1.2.x shipped _workspace/07_thumbnail/node_modules/
# (playwright-core, ~4.5MB) and .claude/settings.local.json to PyPI.
[tool.hatch.build.targets.sdist]
include = [
    "/tokenhabit",
    "/skill",
    "/tests",
    "/README.md",
    "/README.en.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]
