<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --cyan:#2dd4bf; --red:#fb5e7e; --bg0:#0a0e13; --bg1:#10161f; --bd:#222c38; --tx:#e8eef5; --mut:#8a98a8; }
  html,body{ width:1280px; height:640px; }
  body{
    font-family:'Pretendard',-apple-system,sans-serif;
    background:
      radial-gradient(760px 460px at 84% 12%, rgba(45,212,191,.10), transparent 60%),
      linear-gradient(150deg,var(--bg0),var(--bg1));
    color:var(--tx); overflow:hidden; position:relative;
  }
  .grid{ position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:40px 40px; mask-image:radial-gradient(880px 620px at 34% 42%,#000,transparent 82%); }
  .wrap{ position:relative; height:100%; display:flex; gap:48px; padding:52px 60px 46px; }
  .left{ flex:1.02; display:flex; flex-direction:column; }
  .kicker{ font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); font-weight:500; display:flex; align-items:center; gap:10px; }
  .kicker::before{ content:""; width:24px; height:2px; background:var(--cyan); display:inline-block; }
  h1{ font-size:50px; font-weight:800; letter-spacing:-.035em; line-height:1.14; margin-top:22px; }
  h1 .c{ color:var(--cyan); }
  .lead{ font-size:17.5px; color:var(--mut); margin-top:18px; font-weight:500; line-height:1.55; }
  .foot{ margin-top:auto; }
  .brand{ font-size:40px; font-weight:800; letter-spacing:-.03em; }
  .brand .b{ color:var(--cyan); }
  .brandsub{ font-size:14px; color:var(--mut); margin-top:7px; font-weight:500; }
  .cmd{ display:inline-flex; gap:10px; margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:16px; background:#0c1219; border:1px solid var(--bd); border-radius:10px; padding:11px 16px; color:#cdd9e5; }
  .cmd .d{ color:var(--cyan); font-weight:700; }

  .table{ flex:1; align-self:center; border:1px solid var(--bd); border-radius:15px; overflow:hidden; background:linear-gradient(180deg,#0e141c,#0b1016); box-shadow:0 30px 70px -30px rgba(0,0,0,.75); }
  .head{ display:flex; padding:14px 22px; border-bottom:1px solid #1a232e; font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.05em; color:#61707f; }
  .head .a{ flex:1.3; } .head .b{ flex:1; }
  .r{ display:flex; align-items:center; padding:19px 22px; border-bottom:1px solid #161e28; }
  .r:last-child{ border-bottom:none; }
  .r .a{ flex:1.3; font-size:17px; font-weight:600; color:#c3ced9; }
  .r .a s{ color:#6b7887; text-decoration-color:var(--red); text-decoration-thickness:2px; }
  .r .b{ flex:1; font-size:17px; font-weight:700; color:var(--cyan); display:flex; align-items:center; gap:9px; }
  .r .b .ar{ color:#3d4a58; font-family:'JetBrains Mono',monospace; font-size:15px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">Claude Code · 토큰 진단</div>
      <h1>절감 조언에는<br>출처 없는 <span class="c">숫자</span>가 붙는다</h1>
      <div class="lead">방향은 맞는데 수치가 근거 없는 경우가 많다.<br>공급자 공식 문서로 확인되는 값은 오른쪽과 같다.</div>
      <div class="foot">
        <div class="brand">token<span class="b">habit</span></div>
        <div class="brandsub">Claude Code 토큰 낭비 습관 진단 · 9카테고리 31패턴</div>
        <div class="cmd"><span class="d">$</span> uvx tokenhabit --lang ko</div>
      </div>
    </div>

    <div class="table">
      <div class="head"><div class="a">떠도는 수치</div><div class="b">공식 문서</div></div>
      <div class="r">
        <div class="a"><s>AI 코딩 비용 90%가 낭비</s></div>
        <div class="b"><span class="ar">→</span> 1차 출처 미확인</div>
      </div>
      <div class="r">
        <div class="a"><s>최상위 모델 쓰면 30배</s></div>
        <div class="b"><span class="ar">→</span> 5~10배</div>
      </div>
      <div class="r">
        <div class="a"><s>배치로 70~90% 절감</s></div>
        <div class="b"><span class="ar">→</span> 50%</div>
      </div>
      <div class="r">
        <div class="a">프리픽스 바뀌면 캐시 무효</div>
        <div class="b"><span class="ar">→</span> 사실 · 읽기 0.1x</div>
      </div>
    </div>
  </div>
</body>
</html>
