<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --cyan:#2dd4bf; --red:#fb5e7e; --bg0:#0a0e13; --bg1:#10161f; --bd:#232e3b; --tx:#e8eef5; --mut:#94a2b2; }
  html,body{ width:1200px; height:1200px; }
  body{
    font-family:'Pretendard',-apple-system,sans-serif;
    background:
      radial-gradient(880px 620px at 78% 6%, rgba(45,212,191,.13), transparent 62%),
      radial-gradient(700px 620px at 2% 100%, rgba(251,94,126,.06), transparent 55%),
      linear-gradient(150deg,var(--bg0),var(--bg1));
    color:var(--tx); overflow:hidden; position:relative;
  }
  .grid{ position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:48px 48px; mask-image:radial-gradient(900px 900px at 42% 40%,#000,transparent 84%); }
  .wrap{ position:relative; height:100%; display:flex; flex-direction:column; padding:76px 72px 66px; }

  .top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-size:46px; font-weight:800; letter-spacing:-.035em; line-height:1; }
  .brand .b{ color:var(--cyan); }
  .kicker{ font-family:'JetBrains Mono',monospace; font-size:16px; letter-spacing:.16em; text-transform:uppercase; color:#6c7b8b; font-weight:500; }

  .hero{ margin-top:92px; }
  .hl{ font-size:44px; font-weight:700; letter-spacing:-.02em; color:#cfdae6; line-height:1.25; display:flex; align-items:center; gap:18px; }
  .tagx{ font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:500; letter-spacing:.08em; color:#6c7b8b; border:1px solid var(--bd); border-radius:999px; padding:7px 15px; }
  .big{ display:flex; align-items:baseline; gap:22px; margin-top:6px; }
  .big .n{ font-size:250px; font-weight:800; letter-spacing:-.05em; color:var(--cyan); line-height:.92; }
  .big .t{ font-size:56px; font-weight:800; letter-spacing:-.02em; color:#f2f7fb; }
  .lead{ font-size:29px; color:var(--mut); margin-top:34px; font-weight:500; line-height:1.5; }

  .chips{ margin-top:56px; display:flex; flex-direction:column; gap:15px; }
  .chip{ display:flex; align-items:center; gap:20px; background:#0e151e; border:1px solid var(--bd); border-radius:14px; padding:22px 26px; }
  .chip .k{ font-size:27px; font-weight:700; color:#e2eaf3; }
  .chip .ar{ font-family:'JetBrains Mono',monospace; font-size:22px; color:#41505f; margin-left:auto; }
  .chip .v{ font-size:25px; font-weight:600; color:var(--cyan); font-family:'JetBrains Mono',monospace; }
  .chip .v.ko{ font-family:'Pretendard',sans-serif; font-weight:600; }

  .foot{ margin-top:auto; padding-top:52px; display:flex; align-items:center; justify-content:space-between; }
  .cmd{ display:inline-flex; gap:14px; font-family:'JetBrains Mono',monospace; font-size:30px; background:#0c1219; border:1px solid var(--bd); border-radius:14px; padding:20px 28px; color:#dbe5ee; }
  .cmd .d{ color:var(--cyan); font-weight:700; }
  .meta{ font-size:19px; color:#6c7b8b; font-weight:500; text-align:right; line-height:1.5; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="top">
      <div class="brand">token<span class="b">habit</span></div>
      <div class="kicker">Claude Code</div>
    </div>

    <div class="hero">
      <div class="hl">토큰 낭비 점수 <span class="tagx">예시 리포트</span></div>
      <div class="big"><span class="n">25%</span><span class="t">가 낭비</span></div>
      <div class="lead">로컬 로그를 읽어 어디서 새는지 찾아주는 CLI.<br>습관마다 바로 칠 커맨드까지 같이 나옵니다.</div>
    </div>

    <div class="chips">
      <div class="chip"><span class="k">컨텍스트 과적재</span><span class="ar">→</span><span class="v">/compact</span></div>
      <div class="chip"><span class="k">로그 통째로 붙여넣기</span><span class="ar">→</span><span class="v ko">에러 30줄만</span></div>
      <div class="chip"><span class="k">최상위 모델 고정 주행</span><span class="ar">→</span><span class="v">/model</span></div>
    </div>

    <div class="foot">
      <div class="cmd"><span class="d">$</span> uvx tokenhabit --lang ko</div>
      <div class="meta">설치 불필요 · 의존성 0<br>LLM 호출 0 · 전부 로컬</div>
    </div>
  </div>
</body>
</html>
